<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="850" viewBox="0 0 2400 850"><defs><marker id="arrow-666666" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker><marker id="arrow-cc0000" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cc0000"/></marker><marker id="arrow-d79b00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d79b00"/></marker><marker id="arrow-6c8ebf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c8ebf"/></marker></defs><rect width="2400" height="850" fill="#ffffff"/><text x="210" y="28" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">Две структуры: ЭТАПЫ = в каком порядке идут алгоритмы · МИШЕНИ = по какой из них работать · Цвет = модуль (глава книги)</text><rect x="20" y="300" width="150" height="110" rx="10" fill="#f5f5f5" stroke="#666666" stroke-width="1"/><text x="95" y="322" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">ФРАЗА</text><text x="95" y="344" font-family="DejaVu Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#1a1a1a">«Я никогда не выучу</text><text x="95" y="358" font-family="DejaVu Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#1a1a1a">английский, потому</text><text x="95" y="372" font-family="DejaVu Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#1a1a1a">что нет способностей»</text><rect x="210" y="60" width="280" height="620" rx="10" fill="#e8f4f8" stroke="#6c8ebf" stroke-width="1.5"/><text x="222" y="80" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1a1a1a">ДИАГНОСТИКА — заполняет карту</text><rect x="240" y="120" width="220" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/><text x="350.0" y="159.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">Разбор (гл. 6)</text><rect x="240" y="240" width="220" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/><text x="350.0" y="279.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">Детектор кванторов (гл. 6)</text><rect x="240" y="360" width="220" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/><text x="350.0" y="399.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">4 вопроса-причины (гл. 6)</text><rect x="540" y="200" width="240" height="340" rx="0" fill="#ffffff" stroke="#666666" stroke-width="1.5"/><text x="554" y="226" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1a1a1a">КАРТА УБЕЖДЕНИЯ</text><text x="554" y="245" font-family="DejaVu Sans, sans-serif" font-size="11.5" text-anchor="start" fill="#1a1a1a">тип: C-E («потому что»)</text><text x="554" y="264" font-family="DejaVu Sans, sans-serif" font-size="11.5" text-anchor="start" fill="#1a1a1a">A: «нет способностей»</text><text x="554" y="283" font-family="DejaVu Sans, sans-serif" font-size="11.5" text-anchor="start" fill="#1a1a1a">B: «не выучу английский»</text><text x="554" y="302" font-family="DejaVu Sans, sans-serif" font-size="11.5" text-anchor="start" fill="#1a1a1a"></text><text x="554" y="321" font-family="DejaVu Sans, sans-serif" font-size="11.5" text-anchor="start" fill="#1a1a1a">мишень I  основание   ▲ уязвим</text><text x="554" y="340" font-family="DejaVu Sans, sans-serif" font-size="11.5" text-anchor="start" fill="#1a1a1a">мишень II следствие  ▲▲ сильная</text><text x="554" y="359" font-family="DejaVu Sans, sans-serif" font-size="10.5" text-anchor="start" fill="#1a1a1a">           («никогда»)</text><text x="554" y="378" font-family="DejaVu Sans, sans-serif" font-size="11.5" text-anchor="start" fill="#1a1a1a">мишень III масштаб    —</text><text x="554" y="397" font-family="DejaVu Sans, sans-serif" font-size="11.5" text-anchor="start" fill="#1a1a1a">мишень IV рамка       —</text><text x="554" y="416" font-family="DejaVu Sans, sans-serif" font-size="11.5" text-anchor="start" fill="#1a1a1a">мишень V мета         —</text><rect x="900" y="60" width="670" height="620" rx="10" fill="#fff0e6" stroke="#d79b00" stroke-width="1.5"/><text x="912" y="80" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1a1a1a">ИНТЕРВЕНЦИЯ — подтверждённая мишень → паттерн</text><text x="912" y="96" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="start" fill="#4a4a4a">внутри мишени алгоритмы взаимозаменяемы · мишеней может быть несколько — серия применений с перепроверкой</text><rect x="920" y="110" width="630" height="100" rx="6" fill="#fdf3e7" stroke="#d6b656" stroke-width="1.2"/><text x="930" y="127" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#1a1a1a">Мишень I — основание  ▲</text><rect x="935" y="144" width="185" height="44" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><text x="1027.5" y="170.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">№1 Намерение</text><rect x="1130" y="144" width="185" height="44" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><text x="1222.5" y="170.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">№2 Переопределение</text><rect x="920" y="220" width="630" height="100" rx="6" fill="#fdf3e7" stroke="#cc0000" stroke-width="1.2"/><text x="930" y="237" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#b00000">Мишень II — следствие / ценность  ▲▲</text><rect x="935" y="254" width="140" height="44" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><text x="1005.0" y="280.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">№3 Последствия</text><rect x="1090" y="254" width="140" height="44" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><text x="1160.0" y="280.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">№8 Другой результат</text><rect x="1245" y="254" width="140" height="44" rx="6" fill="#fff2cc" stroke="#cc0000" stroke-width="2"/><text x="1315.0" y="274.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">№11 Противоположный</text><text x="1315.0" y="288.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">пример</text><rect x="1400" y="254" width="140" height="44" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><text x="1470.0" y="280.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">№12 Иерархия критериев</text><text x="930" y="315" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="start" fill="#996600">№3 / №8 / №11 / №12 — взаимозаменяемы</text><rect x="920" y="330" width="630" height="100" rx="6" fill="#fdf3e7" stroke="#d6b656" stroke-width="1.2"/><text x="930" y="347" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#1a1a1a">Мишень III — масштаб элементов</text><rect x="935" y="364" width="190" height="44" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><text x="1030.0" y="390.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">№4 Разделение</text><rect x="1135" y="364" width="190" height="44" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><text x="1230.0" y="390.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">№5 Объединение</text><rect x="1335" y="364" width="190" height="44" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><text x="1430.0" y="390.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">№6 Аналогия</text><rect x="920" y="440" width="630" height="100" rx="6" fill="#fdf3e7" stroke="#d6b656" stroke-width="1.2"/><text x="930" y="457" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#1a1a1a">Мишень IV — рамка восприятия</text><rect x="935" y="474" width="190" height="44" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><text x="1030.0" y="500.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">№7 Размер фрейма</text><rect x="1135" y="474" width="190" height="44" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><text x="1230.0" y="500.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">№9 Модель мира</text><rect x="1335" y="474" width="190" height="44" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><text x="1430.0" y="500.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">№10 Стратегия реальности</text><rect x="920" y="550" width="630" height="100" rx="6" fill="#fdf3e7" stroke="#d6b656" stroke-width="1.2"/><text x="930" y="567" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#1a1a1a">Мишень V — рефлексивный</text><rect x="935" y="584" width="185" height="44" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><text x="1027.5" y="610.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">№13 Примени к себе</text><rect x="1130" y="584" width="185" height="44" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><text x="1222.5" y="610.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">№14 Метафрейм</text><rect x="1590" y="300" width="160" height="110" rx="10" fill="#f5f5f5" stroke="#666666" stroke-width="1"/><text x="1670" y="322" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">СДВИГ</text><text x="1670" y="342" font-family="DejaVu Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#1a1a1a">«падал — но 10 футов</text><text x="1670" y="356" font-family="DejaVu Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#1a1a1a">проехал; уже знаю</text><text x="1670" y="370" font-family="DejaVu Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#1a1a1a">200 слов»</text><rect x="1770" y="60" width="280" height="620" rx="10" fill="#e8f5e9" stroke="#82b366" stroke-width="1.5"/><text x="1782" y="80" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1a1a1a">ИНТЕГРАЦИЯ — закрепляет новое</text><rect x="1800" y="120" width="220" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/><text x="1910.0" y="153.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">Проверка соединительными словами</text><text x="1910.0" y="167.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">(гл. 6)</text><rect x="1800" y="240" width="220" height="70" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/><text x="1910.0" y="279.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">Цикл 6 позиций (гл. 7)</text><rect x="1800" y="360" width="220" height="70" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/><text x="1910.0" y="399.0" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">Якорение состояния (гл. 7)</text><rect x="2090" y="300" width="190" height="110" rx="10" fill="#f5f5f5" stroke="#666666" stroke-width="1"/><text x="2185" y="326" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">ЗАКРЕПЛЕНО</text><text x="2185" y="346" font-family="DejaVu Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#1a1a1a">новое убеждение +</text><text x="2185" y="360" font-family="DejaVu Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#1a1a1a">основания + якорь</text><polyline points="170,355 205,355 205,155 240,155" fill="none" stroke="#666666" stroke-width="1" marker-end="url(#arrow-666666)"/><polyline points="350,190 350,240" fill="none" stroke="#666666" stroke-width="1" marker-end="url(#arrow-666666)"/><polyline points="350,310 350,360" fill="none" stroke="#666666" stroke-width="1" marker-end="url(#arrow-666666)"/><polyline points="460,395 500,395 500,370 540,370" fill="none" stroke="#666666" stroke-width="1" marker-end="url(#arrow-666666)"/><text x="500" y="417" font-family="DejaVu Sans, sans-serif" font-size="10" text-anchor="middle" fill="#666666">выход: карта</text><polyline points="780,285 840,285 840,160 900,160" fill="none" stroke="#d79b00" stroke-width="2" marker-end="url(#arrow-d79b00)"/><text x="858" y="232" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#d79b00">применение 2</text><text x="858" y="246" font-family="DejaVu Sans, sans-serif" font-size="10" text-anchor="middle" fill="#d79b00">мишень I ▲</text><polyline points="780,370 840,370 840,270 900,270" fill="none" stroke="#cc0000" stroke-width="2" marker-end="url(#arrow-cc0000)"/><text x="858" y="322" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#cc0000">применение 1</text><text x="858" y="336" font-family="DejaVu Sans, sans-serif" font-size="10" text-anchor="middle" fill="#cc0000">мишень II ▲▲</text><polyline points="1315,298 1315,327 1570,327 1570,340 1590,340" fill="none" stroke="#cc0000" stroke-width="2" marker-end="url(#arrow-cc0000)"/><text x="1315" y="313" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#cc0000">применение 1: №11</text><polyline points="1550,160 1578,160 1578,355 1590,355" fill="none" stroke="#d79b00" stroke-width="2" marker-end="url(#arrow-d79b00)"/><text x="1545" y="139" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="bold" text-anchor="end" fill="#d79b00">применение 2: №2</text><polyline points="1670,300 1670,50 660,50 660,200" fill="none" stroke="#6c8ebf" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#arrow-6c8ebf)"/><text x="1165" y="42" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#6c8ebf">после каждого применения — ПЕРЕПРОВЕРКА: карта изменилась</text><polyline points="1750,355 1762,355 1762,155 1800,155" fill="none" stroke="#666666" stroke-width="1" marker-end="url(#arrow-666666)"/><text x="1670" y="430" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#666666">мишеней не осталось</text><polyline points="1910,190 1910,240" fill="none" stroke="#666666" stroke-width="1" marker-end="url(#arrow-666666)"/><polyline points="1910,310 1910,360" fill="none" stroke="#666666" stroke-width="1" marker-end="url(#arrow-666666)"/><polyline points="2020,395 2055,395 2055,355 2090,355" fill="none" stroke="#666666" stroke-width="1" marker-end="url(#arrow-666666)"/><text x="210" y="730" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#1a1a1a">Цвет блока = модуль (глава книги)</text><rect x="210" y="745" width="230" height="30" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/><text x="325" y="764" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">гл. 6 — структура убеждений (модуль 1)</text><rect x="460" y="745" width="230" height="30" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><text x="575" y="764" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">гл. 9 — 14 паттернов (модуль 2)</text><rect x="710" y="745" width="230" height="30" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/><text x="825" y="764" font-family="DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a">гл. 7 — состояния (модуль 3)</text><text x="210" y="800" font-family="DejaVu Sans, sans-serif" font-size="12" text-anchor="start" fill="#1a1a1a">Правило сборки: два алгоритма стыкуются ⟺ выход одного совпадает со входом другого. Этапы задают порядок, мишени — выбор (до диагностики — потенциальная, после — подтверждённая). После каждого применения — перепроверка карты. Композиция = конкретная цепочка, собранная по этим правилам.</text></svg>