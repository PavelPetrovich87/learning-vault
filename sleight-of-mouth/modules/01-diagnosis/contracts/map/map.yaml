id: contract-map
module: 01-diagnosis
direction: output
data-type: карта убеждения
produced-by:
  - 01-diagnosis/b3-explicate
consumed-by:
  - 02-intervention
ontology: research/composition-model.md §4
fields:
  фраза: {type: string}       # исходная формулировка — копия входа после проверок порта; вписывается при создании карты, до b1. Материал для b2 (маркеры уровня фразы) и для 02-intervention (ответ на высказывание)
  тип: {enum: [CEq, C-E, неполное]} # CEq «А = Б» | C-E «А → Б» | неполное — обобщение без связки (с. 125); полнота = тип ≠ неполное
  A: {type: string}          # основание: причина (C-E) | определяемый термин (CEq) | фрагмент-обобщение (неполное)
  B: {type: string}          # следствие: результат (C-E) | определение (CEq) | пусто при неполном
  мишени:
    I: {enum: [—, ▲, ▲▲]}   # основание
    II: {enum: [—, ▲, ▲▲]}  # следствие/ценность
    III: {enum: [—, ▲, ▲▲]} # масштаб
    IV: {enum: [—, ▲, ▲▲]}  # рамка
    V: {enum: [—, ▲, ▲▲]}   # мета
